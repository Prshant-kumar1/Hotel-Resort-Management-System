<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | Hotel Resort</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/booking.css">
</head>

<body>

    <main class="page-container">

        <div class="page-header">
            <h1>My Bookings</h1>
            <p>View and manage your hotel reservations.</p>
        </div>

        <div class="bookings-table-wrap">

            <table class="bookings-table">

                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>Room</th>
                        <th>Check-in</th>
                        <th>Check-out</th>
                        <th>Guests</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>#BK1001</td>
                        <td>Deluxe Room</td>
                        <td>20 Sep 2026</td>
                        <td>23 Sep 2026</td>
                        <td>2</td>
                        <td>
                            <span class="status status-confirmed">
                                Confirmed
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td>#BK1002</td>
                        <td>Luxury Suite</td>
                        <td>05 Oct 2026</td>
                        <td>08 Oct 2026</td>
                        <td>3</td>
                        <td>
                            <span class="status status-confirmed">
                                Confirmed
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td>#BK1003</td>
                        <td>Family Room</td>
                        <td>15 Nov 2026</td>
                        <td>18 Nov 2026</td>
                        <td>4</td>
                        <td>
                            <span class="status status-pending">
                                Pending
                            </span>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Aurelia Bay Resort</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <main class="auth-wrap">

        <section class="auth-card">

            <img src="images/admin-resort.jpg" alt="Aurelia Bay Resort">

            <span class="eyebrow">Aurelia Bay Resort</span>

            <h1>Admin Login</h1>

            <p>Sign in to access the admin dashboard.</p>

            <form action="admin-dashboard.html">

                <div class="form-group">
                    <label class="form-label" for="admin-email">
                        Email Address
                    </label>

                    <input
                        class="form-input"
                        type="email"
                        id="admin-email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="admin-password">
                        Password
                    </label>

                    <input
                        class="form-input"
                        type="password"
                        id="admin-password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="login-options">

                    <label>
                        <input
                            type="checkbox"
                            id="remember-me"
                            name="remember"
                        >
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button class="btn btn-primary btn-block" type="submit">
                    Login
                </button>

            </form>

            <p class="auth-foot">
                <a href="index.html">← Back to website</a>
            </p>

        </section>

    </main>

</body>
</html>

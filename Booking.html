<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking | Aurelia Bay</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/booking.css">
</head>

<body>

    <main class="page-container">

        <section class="booking-form">

            <div class="page-header">
                <h1>Book Your Stay</h1>
                <p>Enter your details to reserve your room.</p>
            </div>

            <form>

                <div class="form-group">
                    <label for="guest-name">Guest Name</label>
                    <input
                        type="text"
                        id="guest-name"
                        class="form-input"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        class="form-input"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="room">Select Room</label>

                    <select id="room" class="form-input" required>
                        <option value="">Select a room</option>
                        <option value="garden-deluxe-room">Garden Deluxe Room</option>
                        <option value="premium-ocean-room">Premium Ocean Room</option>
                        <option value="executive-suite">Executive Suite</option>
                        <option value="family-room">Family Room</option>
                        <option value="poolside-villa">Poolside Villa</option>
                        <option value="presidential-suite">Presidential Suite</option>
                    </select>
                </div>

                <div class="booking-form-row">

                    <div class="form-group">
                        <label for="check-in">Check-in</label>
                        <input
                            type="date"
                            id="check-in"
                            class="form-input"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="check-out">Check-out</label>
                        <input
                            type="date"
                            id="check-out"
                            class="form-input"
                            required
                        >
                    </div>

                </div>

                <div class="booking-form-row">

                    <div class="form-group">
                        <label for="guests">Number of Guests</label>
                        <input
                            type="number"
                            id="guests"
                            class="form-input"
                            min="1"
                            max="10"
                            value="1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="rooms">Number of Rooms</label>
                        <input
                            type="number"
                            id="rooms"
                            class="form-input"
                            min="1"
                            max="5"
                            value="1"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="requests">Special Requests</label>

                    <textarea
                        id="requests"
                        class="form-input"
                        rows="4"
                        placeholder="Any special requests?"
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Confirm Booking
                </button>

            </form>

        </section>

    </main>

</body>

</html>
